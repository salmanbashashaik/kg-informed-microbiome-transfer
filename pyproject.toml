[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-kg"
version = "1.0.0"
description = "Knowledge Graph-Informed Foundation Model for Microbiome-Cardiovascular Disease Classification (IEEE BIBM 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shaik Salman Basha", email = "ssbasha@uwaterloo.ca"},
    {name = "Ziting Shen"},
    {name = "Anita Layton"},
    {name = "Sun Sun"},
    {name = "Helen Hong Chen"}
]
keywords = [
    "microbiome",
    "knowledge graph",
    "foundation model",
    "transfer learning",
    "cardiovascular disease",
    "type 2 diabetes",
    "rgcn",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "tqdm>=4.64.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
